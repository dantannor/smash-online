<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smash Online Host</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #10151d; color: #edf2f7; }
    body { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    button, select { font: inherit; padding: .55rem .8rem; border-radius: .4rem; }
    button { cursor: pointer; }
    .row { display: flex; gap: .7rem; align-items: center; flex-wrap: wrap; }
    .slots { display: grid; grid-template-columns: repeat(auto-fit,minmax(250px,1fr)); gap: 1rem; }
    article, section { background: #1b2430; padding: 1rem; border-radius: .65rem; margin: 1rem 0; }
    input.link { width: min(100%, 22rem); }
    #preview { display: block; width: min(100%, 720px); max-height: 405px; background: black; }
    .muted { color: #a8b3c2; } .error { color: #ff9b9b; }
    dd { margin: 0 0 .4rem; }
  </style>
</head>
<body>
  <h1>Smash Online host</h1>
  <section>
    <div class="row">
      <label for="source">Capture source</label>
      <select id="source"><option value="display">Game window / screen</option><option value="canvas">Test canvas</option></select>
      <button id="start">Create room</button>
      <button id="resume" hidden>Resume capture</button>
      <label><input id="p1-toggle" type="checkbox"> Enable host gamepad as P1</label>
    </div>
    <p id="status" role="status" class="muted">No room yet.</p>
    <video id="preview" autoplay muted playsinline></video>
  </section>
  <section><h2>Guest links</h2><div id="guest-links" class="slots"></div></section>
  <section><h2>Connection stats</h2><div id="stats" class="slots"></div></section>
  <script type="module" src="/host/host.js"></script>
</body>
</html>
