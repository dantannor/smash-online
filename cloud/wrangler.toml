name = "smash-online"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/ws", "/healthz", "/go/*", "/p/*", "/join/*"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

[triggers]
crons = ["*/10 * * * *"]

[vars]
GCP_PROJECT = "smash-online-511318"
GCP_ZONE = "me-west1-c"
GCP_INSTANCE = "smash-online"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Registry"]
